 .ctl button:disabled{opacity:.3;cursor:default}
}

<script>
(function(){
var t=document.getElementById('track'),n=t.children.length,i=0,c=document.getElementById('count'),p=document.getElementById('prev'),x=document.getElementById('next'),lock=0;
var desk=function(){return innerWidth>820};
function go(k){i=Math.max(0,Math.min(n-1,k));t.style.transform=desk()?'translateX('+(-i*100)+'vw)':'';c.textContent=(i+1)+' / '+n;p.disabled=i==0;x.disabled=i==n-1;
 var im=t.children[Math.min(n-1,i+1)].querySelector('img');im.loading='eager';}
p.onclick=function(){go(i-1)};x.onclick=function(){go(i+1)};
addEventListener('keydown',function(e){if(!desk())return;if(e.key=='ArrowRight'||e.key=='PageDown'||e.key==' '){e.preventDefault();go(i+1)}if(e.key=='ArrowLeft'||e.key=='PageUp'){e.preventDefault();go(i-1)}});
addEventListener('wheel',function(e){if(!desk()||lock)return;var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<25)return;lock=1;go(i+(d>0?1:-1));setTimeout(function(){lock=0},700)},{passive:true});
var sx=null;t.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
t.addEventListener('touchend',function(e){if(!desk()||sx==null)return;var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)go(i+(d<0?1:-1));sx=null});
addEventListener('resize',function(){go(i)});go(0);
})();
</script></body></html>
