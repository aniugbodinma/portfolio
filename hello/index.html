<style>
  :root {
    --bg: #F8F8F8;
    --ink: #111;
    --muted: #555;
    --line: #e6e6e6;
    --ease: cubic-bezier(.25, 1, .5, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid #111; outline-offset: 3px; }
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    perspective: 900px;
  }
  .bg i { display: block; font-style: normal; }
  .page {
    position: relative;
    z-index: 1;
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 28px 24px 32px;
  }
  .mark {
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: min(640px, 100%);
    margin: 0 auto;
    padding: 48px 0 64px;
  }
  h1 {
    margin: 0;
    font-size: clamp(44px, 10vw, 76px);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 0.98;
  }
  .lead {
    margin: 22px 0 0;
    max-width: 36em;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.5;
  }
  .social {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 32px 0 0;
    padding: 0;
    list-style: none;
  }
  .social a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 14px 0 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  .social a:hover { border-color: #ccc; }
  .social svg { display: block; }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    color: #A0A0A0;
    font-size: 13px;
  }
  .rise {
    animation: rise 0.9s var(--ease) both;
  }
  .d1 { animation-delay: 0.08s; }
  .d2 { animation-delay: 0.16s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  @media (max-width: 560px) {
    .page { padding: 22px 20px 24px; }
    .lead { font-size: 16px; }
    .social a { flex: 1 1 auto; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; }
  }
</style>

<body>
<div class="bg" aria-hidden="true"></div>
<div class="page">
  <p class="mark">Dinma Aniugbo</p>
  <main>
    <h1 class="rise">Dinma Aniugbo</h1>
    <p class="lead rise d1">Hello there, my website is still under construction. Say hi on LinkedIn, Instagram or TikTok.</p>
    <ul class="social rise d2">
      <li>

<script>
(function () {
  var layer = document.querySelector('.bg');
  var reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var mx = -999, my = -999, tiles = [];
  var rest = 'rgba(0,0,0,.0088)';
  function size() { return innerWidth <= 820 ? 52 : 70; }
  function build() {
    layer.replaceChildren();
    tiles = [];
    var s = size(), w = innerWidth, h = innerHeight;
    for (var y = 0; y < h; y += s) {
      for (var x = 0; x < w; x += s) {
        var t = document.createElement('i');
        t.style.cssText = 'position:absolute;left:' + (x + 4) + 'px;top:' + (y + 4) + 'px;width:' + (s - 8) + 'px;height:' + (s - 8) + 'px;border-radius:12px;background:' + rest + ';transition:transform .5s cubic-bezier(.25,1,.5,1),background .5s';
        layer.appendChild(t);
        tiles.push([t, x + s / 2, y + s / 2]);
      }
    }
  }
  build();
  addEventListener('resize', build);
  if (reduce) return;
  addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; });
  addEventListener('mouseleave', function () { mx = my = -999; });
  var tp = function (e) {
    var touch = e.touches && e.touches[0];
    if (!touch) return;
    mx = touch.clientX; my = touch.clientY;
  };
  addEventListener('touchstart', tp, { passive: true });
  addEventListener('touchmove', tp, { passive: true });
  addEventListener('touchend', function () { setTimeout(function () { mx = my = -999; }, 250); }, { passive: true });
  (function frame() {
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i][0], x = tiles[i][1], y = tiles[i][2];
      var dx = mx - x, dy = my - y, d = Math.hypot(dx, dy);
      var k = Math.max(0, 1 - d / 240);
      t.style.transform = k ? 'rotateX(' + (-dy / d * k * 13) + 'deg) rotateY(' + (dx / d * k * 13) + 'deg) scale(' + (1 - k * 0.06) + ')' : 'none';
      t.style.background = k ? 'rgba(150,124,239,' + (0.0088 + k * 0.0495) + ')' : rest;
    }
    requestAnimationFrame(frame);
  })();
})();
</script>
