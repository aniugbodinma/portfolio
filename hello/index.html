<style>
  :root {
    --bg: #F8F8F8;
    --ink: #111;
    --muted: #555;
    --line: #e6e6e6;
    --ease: cubic-bezier(.25, 1, .5, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid #111; outline-offset: 3px; }
  .page {
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 28px 24px 32px;
  }
  .mark {
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: min(640px, 100%);
    margin: 0 auto;
    padding: 48px 0 64px;
  }
  h1 {
    margin: 0;
    font-size: clamp(44px, 10vw, 76px);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 0.98;
  }
  .lead {
    margin: 22px 0 0;
    max-width: 36em;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.5;
  }
  .go {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    margin-top: 32px;
    padding: 14px 22px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
  }
  .go span {
    color: rgba(255, 255, 255, 0.62);
    font-weight: 400;
  }
  .go:hover { background: #000; }
  .social {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 28px 0 0;
    padding: 0;
    list-style: none;
  }
  .social a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 14px 0 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  .social a:hover { border-color: #ccc; }
  .social svg { display: block; }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    color: #A0A0A0;
    font-size: 13px;
  }
  .rise {
    animation: rise 0.9s var(--ease) both;
  }
  .d1 { animation-delay: 0.08s; }
  .d2 { animation-delay: 0.16s; }
  .d3 { animation-delay: 0.24s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  @media (max-width: 560px) {
    .page { padding: 22px 20px 24px; }
    .lead { font-size: 16px; }
    .go { width: 100%; justify-content: space-between; }
    .social a { flex: 1 1 auto; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; }
  }
</style>
</head>
<body>
<div class="page">

    <a class="go rise d2" href="https://design.dinmaaniugbo.com">Portfolio <span>design.dinmaaniugbo.com</span></a>
    <ul class="social rise d3">
      <li>

          LinkedIn

      </li>

      </li>
      <li>
        <a href="https://www.tiktok.com/@dinmaaniugbo_" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.5 3c.4 2.4 1.8 4.2 4.1 4.6v2.6c-1.4 0-2.8-.5-4-1.3v6.4a6.3 6.3 0 1 1-6.3-6.3c.3 0 .7 0 1 .1v2.8a3.5 3.5 0 1 0 2.5 3.4V3z"/></svg>
          TikTok
        </a>

  </main>
  <p class="foot"><span>Designed by Dinma Aniugbo</span><span>© 2026</span></p>
</div>

</html>
